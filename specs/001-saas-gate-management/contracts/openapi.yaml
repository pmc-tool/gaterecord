openapi: 3.0.3
info:
  title: SaaS Gate Management API
  version: 1.0.0
  description: |
    Multi-tenant gate access management system API.
    All tenant endpoints require JWT authentication with tenant context.

servers:
  - url: http://localhost:3000/api/v1
    description: Development server

tags:
  - name: Auth
    description: Authentication endpoints
  - name: Super Admin
    description: SaaS platform management (Super Admin only)
  - name: Tenants
    description: Tenant/Building management
  - name: Users
    description: User management
  - name: Gates
    description: Gate management and control
  - name: Simulator
    description: Gate simulator (Phase-1)
  - name: Health
    description: Device and sensor health
  - name: Access
    description: Access methods (RFID, QR, etc.)
  - name: Events
    description: Access event logging and queries
  - name: Policies
    description: Access policy configuration

paths:
  # ==================== AUTH ====================
  /auth/login:
    post:
      tags: [Auth]
      summary: User login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          description: Invalid credentials

  /auth/refresh:
    post:
      tags: [Auth]
      summary: Refresh access token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken:
                  type: string
      responses:
        '200':
          description: Token refreshed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          description: Invalid refresh token

  /auth/logout:
    post:
      tags: [Auth]
      summary: Logout (revoke refresh token)
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Logged out successfully

  /auth/me:
    get:
      tags: [Auth]
      summary: Get current user profile
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current user profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'

  # ==================== SUPER ADMIN ====================
  /admin/plans:
    get:
      tags: [Super Admin]
      summary: List subscription plans
      security:
        - bearerAuth: []
      responses:
        '200':
          description: List of plans
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SubscriptionPlan'
    post:
      tags: [Super Admin]
      summary: Create subscription plan
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePlanRequest'
      responses:
        '201':
          description: Plan created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriptionPlan'

  /admin/plans/{planId}:
    get:
      tags: [Super Admin]
      summary: Get plan details
      security:
        - bearerAuth: []
      parameters:
        - name: planId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Plan details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriptionPlan'
    patch:
      tags: [Super Admin]
      summary: Update plan
      security:
        - bearerAuth: []
      parameters:
        - name: planId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePlanRequest'
      responses:
        '200':
          description: Plan updated

  /admin/tenants:
    get:
      tags: [Super Admin]
      summary: List all tenants
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [active, trial, expired, suspended]
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: Paginated tenant list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedTenants'
    post:
      tags: [Super Admin]
      summary: Onboard new tenant (building)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OnboardTenantRequest'
      responses:
        '201':
          description: Tenant created with admin user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantWithAdmin'

  /admin/tenants/{tenantId}:
    get:
      tags: [Super Admin]
      summary: Get tenant details
      security:
        - bearerAuth: []
      parameters:
        - name: tenantId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Tenant details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tenant'
    patch:
      tags: [Super Admin]
      summary: Update tenant
      security:
        - bearerAuth: []
      parameters:
        - name: tenantId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTenantRequest'
      responses:
        '200':
          description: Tenant updated

  # ==================== USERS ====================
  /users:
    get:
      tags: [Users]
      summary: List users in tenant
      security:
        - bearerAuth: []
      parameters:
        - name: role
          in: query
          schema:
            type: string
        - name: isActive
          in: query
          schema:
            type: boolean
        - name: page
          in: query
          schema:
            type: integer
        - name: limit
          in: query
          schema:
            type: integer
      responses:
        '200':
          description: User list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedUsers'
    post:
      tags: [Users]
      summary: Create user
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
      responses:
        '201':
          description: User created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'

  /users/{userId}:
    get:
      tags: [Users]
      summary: Get user details
      security:
        - bearerAuth: []
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: User details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
    patch:
      tags: [Users]
      summary: Update user
      security:
        - bearerAuth: []
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRequest'
      responses:
        '200':
          description: User updated
    delete:
      tags: [Users]
      summary: Deactivate user
      security:
        - bearerAuth: []
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: User deactivated

  # ==================== GATES ====================
  /gates:
    get:
      tags: [Gates]
      summary: List gates in tenant
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Gate list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Gate'
    post:
      tags: [Gates]
      summary: Create gate
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateGateRequest'
      responses:
        '201':
          description: Gate created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Gate'

  /gates/{gateId}:
    get:
      tags: [Gates]
      summary: Get gate details
      security:
        - bearerAuth: []
      parameters:
        - name: gateId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Gate with controller info
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GateWithController'
    patch:
      tags: [Gates]
      summary: Update gate
      security:
        - bearerAuth: []
      parameters:
        - name: gateId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateGateRequest'
      responses:
        '200':
          description: Gate updated
    delete:
      tags: [Gates]
      summary: Delete gate
      security:
        - bearerAuth: []
      parameters:
        - name: gateId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Gate deleted

  /gates/{gateId}/open:
    post:
      tags: [Gates]
      summary: Open gate (web remote)
      security:
        - bearerAuth: []
      parameters:
        - name: gateId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Gate opening
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GateCommandResponse'
        '409':
          description: Gate in invalid state

  /gates/{gateId}/close:
    post:
      tags: [Gates]
      summary: Close gate (manual/admin)
      security:
        - bearerAuth: []
      parameters:
        - name: gateId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Gate closing

  /gates/{gateId}/status:
    get:
      tags: [Gates]
      summary: Get gate current status
      security:
        - bearerAuth: []
      parameters:
        - name: gateId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Gate status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GateStatus'

  # ==================== HEALTH ====================
  /gates/{gateId}/health:
    get:
      tags: [Health]
      summary: Get device/sensor health
      security:
        - bearerAuth: []
      parameters:
        - name: gateId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Health status for all sensors
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GateHealth'

  /gates/{gateId}/self-test:
    post:
      tags: [Health]
      summary: Trigger self-test
      security:
        - bearerAuth: []
      parameters:
        - name: gateId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '202':
          description: Self-test initiated
          content:
            application/json:
              schema:
                type: object
                properties:
                  testId:
                    type: string
                    format: uuid
                  status:
                    type: string
                    enum: [running, completed, failed]

  # ==================== SIMULATOR ====================
  /simulator/{gateId}/trigger:
    post:
      tags: [Simulator]
      summary: Trigger simulated event
      security:
        - bearerAuth: []
      parameters:
        - name: gateId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SimulatorTriggerRequest'
      responses:
        '200':
          description: Event triggered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimulatorTriggerResponse'

  /simulator/{gateId}/sensors:
    patch:
      tags: [Simulator]
      summary: Update simulated sensor states
      security:
        - bearerAuth: []
      parameters:
        - name: gateId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSensorStatesRequest'
      responses:
        '200':
          description: Sensor states updated

  # ==================== ACCESS - RFID ====================
  /rfid-cards:
    get:
      tags: [Access]
      summary: List RFID cards
      security:
        - bearerAuth: []
      parameters:
        - name: userId
          in: query
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: RFID card list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RfidCard'
    post:
      tags: [Access]
      summary: Register RFID card
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRfidCardRequest'
      responses:
        '201':
          description: Card registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RfidCard'

  /rfid-cards/{cardId}:
    patch:
      tags: [Access]
      summary: Update RFID card
      security:
        - bearerAuth: []
      parameters:
        - name: cardId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateRfidCardRequest'
      responses:
        '200':
          description: Card updated
    delete:
      tags: [Access]
      summary: Delete RFID card
      security:
        - bearerAuth: []
      parameters:
        - name: cardId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Card deleted

  # ==================== ACCESS - VEHICLES ====================
  /vehicles:
    get:
      tags: [Access]
      summary: List vehicles
      security:
        - bearerAuth: []
      parameters:
        - name: ownerId
          in: query
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Vehicle list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Vehicle'
    post:
      tags: [Access]
      summary: Register vehicle
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateVehicleRequest'
      responses:
        '201':
          description: Vehicle registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Vehicle'

  /vehicles/{vehicleId}:
    patch:
      tags: [Access]
      summary: Update vehicle
      security:
        - bearerAuth: []
      parameters:
        - name: vehicleId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateVehicleRequest'
      responses:
        '200':
          description: Vehicle updated
    delete:
      tags: [Access]
      summary: Delete vehicle
      security:
        - bearerAuth: []
      parameters:
        - name: vehicleId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Vehicle deleted

  # ==================== ACCESS - VISITOR PASSES ====================
  /visitor-passes:
    get:
      tags: [Access]
      summary: List visitor passes
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [active, used, expired, cancelled]
        - name: createdById
          in: query
          schema:
            type: string
            format: uuid
        - name: page
          in: query
          schema:
            type: integer
        - name: limit
          in: query
          schema:
            type: integer
      responses:
        '200':
          description: Pass list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedPasses'
    post:
      tags: [Access]
      summary: Create visitor pass
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateVisitorPassRequest'
      responses:
        '201':
          description: Pass created with QR code
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VisitorPass'

  /visitor-passes/{passId}:
    get:
      tags: [Access]
      summary: Get pass details
      security:
        - bearerAuth: []
      parameters:
        - name: passId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Pass details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VisitorPass'
    delete:
      tags: [Access]
      summary: Cancel visitor pass
      security:
        - bearerAuth: []
      parameters:
        - name: passId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Pass cancelled

  /visitor-passes/verify:
    post:
      tags: [Access]
      summary: Verify visitor pass (security)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, gateId]
              properties:
                token:
                  type: string
                gateId:
                  type: string
                  format: uuid
      responses:
        '200':
          description: Verification result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PassVerificationResult'

  # ==================== EVENTS ====================
  /events:
    get:
      tags: [Events]
      summary: Query access events
      security:
        - bearerAuth: []
      parameters:
        - name: gateId
          in: query
          schema:
            type: string
            format: uuid
        - name: method
          in: query
          schema:
            type: string
            enum: [car_rfid, human_rfid, qr, web_app, manual]
        - name: result
          in: query
          schema:
            type: string
            enum: [allowed, denied]
        - name: startDate
          in: query
          schema:
            type: string
            format: date-time
        - name: endDate
          in: query
          schema:
            type: string
            format: date-time
        - name: page
          in: query
          schema:
            type: integer
        - name: limit
          in: query
          schema:
            type: integer
      responses:
        '200':
          description: Paginated events
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedEvents'

  /events/export:
    get:
      tags: [Events]
      summary: Export events as CSV
      security:
        - bearerAuth: []
      parameters:
        - name: gateId
          in: query
          schema:
            type: string
            format: uuid
        - name: startDate
          in: query
          schema:
            type: string
            format: date-time
        - name: endDate
          in: query
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: CSV file
          content:
            text/csv:
              schema:
                type: string
                format: binary

  # ==================== POLICIES ====================
  /policies:
    get:
      tags: [Policies]
      summary: Get tenant access policies
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Policy settings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessPolicy'
    patch:
      tags: [Policies]
      summary: Update policies
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePolicyRequest'
      responses:
        '200':
          description: Policies updated

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    # ===== AUTH =====
    AuthResponse:
      type: object
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        expiresIn:
          type: integer
        user:
          $ref: '#/components/schemas/User'

    # ===== USER =====
    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
        tenantId:
          type: string
          format: uuid
        email:
          type: string
        role:
          type: string
          enum: [super_admin, building_admin, security, resident_owner, resident_tenant, staff_maid, staff_driver]
        firstName:
          type: string
        lastName:
          type: string
        phone:
          type: string
        unitNumber:
          type: string
        isActive:
          type: boolean
        createdAt:
          type: string
          format: date-time

    CreateUserRequest:
      type: object
      required: [email, password, role, firstName, lastName]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
        role:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        phone:
          type: string
        unitNumber:
          type: string

    UpdateUserRequest:
      type: object
      properties:
        firstName:
          type: string
        lastName:
          type: string
        phone:
          type: string
        unitNumber:
          type: string
        isActive:
          type: boolean

    PaginatedUsers:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/User'
        total:
          type: integer
        page:
          type: integer
        limit:
          type: integer

    # ===== TENANT =====
    Tenant:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string
        address:
          type: string
        contactEmail:
          type: string
        contactPhone:
          type: string
        subscriptionPlanId:
          type: string
          format: uuid
        subscriptionStatus:
          type: string
          enum: [active, trial, expired, suspended]
        subscriptionExpiresAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time

    TenantWithAdmin:
      allOf:
        - $ref: '#/components/schemas/Tenant'
        - type: object
          properties:
            adminUser:
              $ref: '#/components/schemas/User'
            temporaryPassword:
              type: string

    OnboardTenantRequest:
      type: object
      required: [name, slug, contactEmail, subscriptionPlanId, adminEmail, adminFirstName, adminLastName]
      properties:
        name:
          type: string
        slug:
          type: string
        address:
          type: string
        contactEmail:
          type: string
        contactPhone:
          type: string
        subscriptionPlanId:
          type: string
          format: uuid
        adminEmail:
          type: string
        adminFirstName:
          type: string
        adminLastName:
          type: string

    UpdateTenantRequest:
      type: object
      properties:
        name:
          type: string
        address:
          type: string
        contactEmail:
          type: string
        contactPhone:
          type: string
        subscriptionPlanId:
          type: string
          format: uuid
        subscriptionStatus:
          type: string

    PaginatedTenants:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Tenant'
        total:
          type: integer
        page:
          type: integer
        limit:
          type: integer

    # ===== SUBSCRIPTION PLAN =====
    SubscriptionPlan:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        maxGates:
          type: integer
        maxUsers:
          type: integer
        logRetentionDays:
          type: integer
        features:
          type: object
        priceMonthly:
          type: number
        isActive:
          type: boolean

    CreatePlanRequest:
      type: object
      required: [name, maxGates, maxUsers, logRetentionDays]
      properties:
        name:
          type: string
        maxGates:
          type: integer
        maxUsers:
          type: integer
        logRetentionDays:
          type: integer
        features:
          type: object
        priceMonthly:
          type: number

    UpdatePlanRequest:
      type: object
      properties:
        name:
          type: string
        maxGates:
          type: integer
        maxUsers:
          type: integer
        logRetentionDays:
          type: integer
        features:
          type: object
        priceMonthly:
          type: number
        isActive:
          type: boolean

    # ===== GATE =====
    Gate:
      type: object
      properties:
        id:
          type: string
          format: uuid
        tenantId:
          type: string
          format: uuid
        name:
          type: string
        type:
          type: string
          enum: [vehicle, pedestrian]
        currentState:
          type: string
          enum: [CLOSED, OPENING, OPEN, CLOSING, OBSTACLE_HOLD, FAULT, MANUAL_OVERRIDE]
        location:
          type: string
        isSimulationMode:
          type: boolean
        isActive:
          type: boolean
        createdAt:
          type: string
          format: date-time

    GateWithController:
      allOf:
        - $ref: '#/components/schemas/Gate'
        - type: object
          properties:
            controller:
              $ref: '#/components/schemas/GateController'

    GateController:
      type: object
      properties:
        id:
          type: string
          format: uuid
        deviceId:
          type: string
        firmwareVersion:
          type: string
        connectionStatus:
          type: string
          enum: [online, offline, unknown]
        lastHeartbeatAt:
          type: string
          format: date-time
        wifiStrength:
          type: integer
        uptimeSeconds:
          type: integer

    CreateGateRequest:
      type: object
      required: [name, type]
      properties:
        name:
          type: string
        type:
          type: string
          enum: [vehicle, pedestrian]
        location:
          type: string

    UpdateGateRequest:
      type: object
      properties:
        name:
          type: string
        location:
          type: string
        isActive:
          type: boolean

    GateStatus:
      type: object
      properties:
        gateId:
          type: string
          format: uuid
        state:
          type: string
        connectionStatus:
          type: string
        lastStateChange:
          type: string
          format: date-time
        lastHeartbeat:
          type: string
          format: date-time

    GateCommandResponse:
      type: object
      properties:
        success:
          type: boolean
        previousState:
          type: string
        newState:
          type: string
        eventId:
          type: string
          format: uuid

    # ===== HEALTH =====
    GateHealth:
      type: object
      properties:
        gateId:
          type: string
          format: uuid
        controller:
          $ref: '#/components/schemas/GateController'
        sensors:
          type: array
          items:
            $ref: '#/components/schemas/SensorStatus'
        lastSelfTest:
          type: string
          format: date-time

    SensorStatus:
      type: object
      properties:
        sensorType:
          type: string
          enum: [esp32_controller, rfid_reader, ir_obstacle, ultrasonic, limit_switch_open, limit_switch_close, servo_actuator, oled_display, led_buzzer]
        isRequired:
          type: boolean
        status:
          type: string
          enum: [ok, abnormal, missing, offline, unknown]
        lastSeenAt:
          type: string
          format: date-time
        lastValue:
          type: object
        notes:
          type: string

    # ===== SIMULATOR =====
    SimulatorTriggerRequest:
      type: object
      required: [event]
      properties:
        event:
          type: string
          enum: [car_rfid_detected, human_rfid_detected, qr_verified, obstacle_detected, obstacle_cleared, limit_open_reached, limit_close_reached, manual_open, manual_close]
        rfidUid:
          type: string
        qrToken:
          type: string

    SimulatorTriggerResponse:
      type: object
      properties:
        success:
          type: boolean
        previousState:
          type: string
        newState:
          type: string
        accessResult:
          type: string
          enum: [allowed, denied]
        eventId:
          type: string
          format: uuid
        message:
          type: string

    UpdateSensorStatesRequest:
      type: object
      properties:
        sensors:
          type: array
          items:
            type: object
            properties:
              sensorType:
                type: string
              status:
                type: string
                enum: [ok, abnormal, missing, offline, unknown]

    # ===== RFID =====
    RfidCard:
      type: object
      properties:
        id:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        uid:
          type: string
        label:
          type: string
        isActive:
          type: boolean
        schedule:
          type: object
        createdAt:
          type: string
          format: date-time

    CreateRfidCardRequest:
      type: object
      required: [userId, uid]
      properties:
        userId:
          type: string
          format: uuid
        uid:
          type: string
        label:
          type: string
        schedule:
          type: object

    UpdateRfidCardRequest:
      type: object
      properties:
        label:
          type: string
        isActive:
          type: boolean
        schedule:
          type: object

    # ===== VEHICLE =====
    Vehicle:
      type: object
      properties:
        id:
          type: string
          format: uuid
        ownerId:
          type: string
          format: uuid
        rfidUid:
          type: string
        plateNumber:
          type: string
        make:
          type: string
        model:
          type: string
        color:
          type: string
        isActive:
          type: boolean
        createdAt:
          type: string
          format: date-time

    CreateVehicleRequest:
      type: object
      required: [plateNumber]
      properties:
        ownerId:
          type: string
          format: uuid
        rfidUid:
          type: string
        plateNumber:
          type: string
        make:
          type: string
        model:
          type: string
        color:
          type: string

    UpdateVehicleRequest:
      type: object
      properties:
        rfidUid:
          type: string
        plateNumber:
          type: string
        make:
          type: string
        model:
          type: string
        color:
          type: string
        isActive:
          type: boolean

    # ===== VISITOR PASS =====
    VisitorPass:
      type: object
      properties:
        id:
          type: string
          format: uuid
        createdById:
          type: string
          format: uuid
        token:
          type: string
        guestName:
          type: string
        guestPhone:
          type: string
        purpose:
          type: string
        validFrom:
          type: string
          format: date-time
        validUntil:
          type: string
          format: date-time
        maxEntries:
          type: integer
        usedEntries:
          type: integer
        gateIds:
          type: array
          items:
            type: string
            format: uuid
        status:
          type: string
          enum: [active, used, expired, cancelled]
        qrCodeData:
          type: string
        createdAt:
          type: string
          format: date-time

    CreateVisitorPassRequest:
      type: object
      required: [guestName, validFrom, validUntil]
      properties:
        guestName:
          type: string
        guestPhone:
          type: string
        purpose:
          type: string
        validFrom:
          type: string
          format: date-time
        validUntil:
          type: string
          format: date-time
        maxEntries:
          type: integer
        gateIds:
          type: array
          items:
            type: string
            format: uuid

    PaginatedPasses:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/VisitorPass'
        total:
          type: integer
        page:
          type: integer
        limit:
          type: integer

    PassVerificationResult:
      type: object
      properties:
        valid:
          type: boolean
        pass:
          $ref: '#/components/schemas/VisitorPass'
        gateAuthorized:
          type: boolean
        remainingEntries:
          type: integer
        denialReason:
          type: string

    # ===== EVENTS =====
    AccessEvent:
      type: object
      properties:
        id:
          type: string
          format: uuid
        gateId:
          type: string
          format: uuid
        gateName:
          type: string
        timestamp:
          type: string
          format: date-time
        method:
          type: string
          enum: [car_rfid, human_rfid, qr, web_app, manual]
        subjectType:
          type: string
          enum: [vehicle, rfid_card, visitor_pass, user, unknown]
        subjectId:
          type: string
          format: uuid
        subjectName:
          type: string
        result:
          type: string
          enum: [allowed, denied]
        denialReason:
          type: string
        operatorId:
          type: string
          format: uuid
        operatorName:
          type: string
        previousState:
          type: string
        newState:
          type: string

    PaginatedEvents:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/AccessEvent'
        total:
          type: integer
        page:
          type: integer
        limit:
          type: integer

    # ===== POLICIES =====
    AccessPolicy:
      type: object
      properties:
        id:
          type: string
          format: uuid
        tenantId:
          type: string
          format: uuid
        defaultPassValidityHours:
          type: integer
        defaultPassMaxEntries:
          type: integer
        requireObstacleSensor:
          type: boolean
        allowWebRemoteOpen:
          type: boolean
        webRemoteOpenRequiresVerification:
          type: boolean
        staffDefaultSchedule:
          type: object
        manualOverrideRequiresAuth:
          type: boolean

    UpdatePolicyRequest:
      type: object
      properties:
        defaultPassValidityHours:
          type: integer
        defaultPassMaxEntries:
          type: integer
        requireObstacleSensor:
          type: boolean
        allowWebRemoteOpen:
          type: boolean
        webRemoteOpenRequiresVerification:
          type: boolean
        staffDefaultSchedule:
          type: object
        manualOverrideRequiresAuth:
          type: boolean
